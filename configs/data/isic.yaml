  image_path:    [image_path, path, filepath, file_path, jpg_path]
  patient_id:    [patient_id, patient, patient_identifier]
  lesion_id:     [lesion_id, lesion, lesion_identifier]
  diagnosis:     [diagnosis, dx, label, target]
  sex:           [sex, gender]
  age:           [age, age_approx, age_years]
  anatomic_site: [anatom_site_general, anatomic_site, localization, lesion_location]
  source:        [dataset, source, attribution, dataset_name, center, site]
onehot_diagnosis: [MEL, NV, BCC, AK, AKIEC, BKL, DF, VASC, SCC]
site_keyword_map:
  BCN_like: [bcn, barcelona]
  HAM_like: [ham, ham10000, vidir, rosendahl, vienna]
  MSK_like: [msk, memorial, sloan]
