seed: 20260706
split_ratios: {train: 0.70, val: 0.15, test: 0.15}
paths:
  raw_metadata: data/raw/isic2019/ISIC_2019_Training_Metadata.csv
  raw_labels:   data/raw/isic2019/ISIC_2019_Training_GroundTruth.csv
  image_dir:    data/raw/isic2019/ISIC_2019_Training_Input
