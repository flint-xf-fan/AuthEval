[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autheval-reproduction"
version = "1.0.0"
description = "Minimal reproduction package for AuthEval"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
data = ["pillow>=10,<13"]
vlm = [
    "torch>=2.5,<2.6",
    "torchvision>=0.20,<0.21",
    "transformers==4.51.3",
    "accelerate>=1,<2",
    "pillow>=10,<13",
    "sentencepiece>=0.2,<1",
    "protobuf>=4,<7",
]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
